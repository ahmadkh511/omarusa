<!-- templates/registration/password_reset_confirm.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Reset Your Password</title>
</head>
<body>
    <h2>Reset Your Password</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Reset Password</button>
    </form>
    <p>Remembered your password? <a href="{% url 'login' %}">Login</a></p>
</body>
</html>
