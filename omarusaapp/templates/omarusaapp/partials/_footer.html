<style>
    /* ============================================
       تنسيق الفوتر المسطح والبسيط (منخفض الارتفاع)
       ============================================ */
    #footer {

        background: #ffffff !important;
        padding: 20px 30px !important;
        margin: 40px auto 10px auto !important; /* زيادة المسافة العلوية لفصل الفوتر عن المحتوى */
        max-width: 1080px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05) !important;
        border-top: 3px solid #00b4d8 !important; /* خط فاصل أزرق سماوي بسيط */
    }
    
    #footer .inner {
        max-width: 1200px !important;
        margin: 0 auto !important;
        display: grid !important;
        /* تقسيم الأعمدة لضمان اتساعها ومنع التفاف النصوص */
        grid-template-columns: 1.5fr 1fr 2fr !important; 
        gap: 20px !important; /* تقليل المسافة بين الأعمدة */
        align-items: start;
    }

    @media (max-width: 980px) {
        #footer {
            padding: 20px !important;
            margin: 15px 10px !important;
        }
        #footer .inner {
            grid-template-columns: 1fr !important;
            gap: 15px !important;
        }
    }

    /* العناوين بخط رأسي يشع نيون */
    #footer h2 {
        font-size: 0.85em !important;
        font-weight: 700 !important;
        color: #1a2a3a !important;
        margin: 0 0 10px 0 !important; /* تقليل المسافة السفلية */
        padding-left: 10px !important;
        border-bottom: none !important;
        display: flex !important;
        align-items: center !important;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        position: relative;
        white-space: nowrap; /* منع نزول النص على سطرين */
    }
    #footer h2::before {
        content: '';
        position: absolute;
        left: 0;
        top: 10%;
        height: 80%;
        width: 3px;
        background: #00b4d8;
        border-radius: 4px;
        box-shadow: 0 0 6px #00f2ff;
    }

    /* تنسيق النصوص والروابط */
    #footer p {
        margin: 0 0 4px 0 !important;
        color: #555 !important;
        font-size: 0.85em !important;
        line-height: 1.5 !important;
    }
    #footer a {
        color: #555 !important;
        text-decoration: none !important;
        transition: all 0.3s !important;
    }
    #footer a:hover {
        color: #00b4d8 !important;
    }

    /* معلومات التواصل */
    .contact-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 6px; /* تقليل المسافة بين العناصر */
    }
    .contact-item .icon {
        color: #00b4d8;
        font-size: 1em;
        min-width: 20px;
        margin-top: 2px;
    }
    .contact-item .text {
        color: #555;
        font-size: 0.85em;
        line-height: 1.4;
    }
    .contact-item .text strong {
        color: #1a2a3a;
        display: block;
        margin-bottom: 1px;
        font-size: 0.9em;
    }

    /* السوشيال ميديا */
    #footer .icons {
        list-style: none !important;
        padding: 0 !important;
        margin: 0 !important;
        display: flex !important;
        gap: 10px !important;
    }
    #footer .icons a {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 34px !important; /* تصغير الأيقونات قليلاً */
        height: 34px !important;
        border-radius: 8px !important;
        background: #f4f7f9 !important;
        border: 1px solid transparent !important;
        color: #555 !important;
        font-size: 1em !important;
        transition: all 0.3s ease !important;
    }
    #footer .icons a:hover {
        background: #00b4d8 !important;
        color: #fff !important;
        transform: translateY(-2px);
        box-shadow: 0 4px 10px rgba(0, 180, 216, 0.3);
    }

    /* نموذج الاتصال (مدمج جداً) */
    #footer input,
    #footer textarea {
        background: transparent !important;
        border: none !important;
        border-bottom: 1px solid #e1e8ed !important;
        border-radius: 0 !important;
        padding: 6px 4px !important; /* تقليل ارتفاع حقول الإدخال */
        font-size: 0.85em !important;
        width: 100% !important;
        margin-bottom: 8px !important; /* تقليل المسافة بين الحقول */
        transition: all 0.3s ease !important;
    }
    #footer input:focus,
    #footer textarea:focus {
        border-color: #00b4d8 !important;
        outline: none !important;
        box-shadow: 0 1px 0 #00f2ff !important;
    }
    #footer textarea {
        resize: none;
    }
    #footer .actions {
        list-style: none !important;
        padding: 0 !important;
        margin: 0 !important;
        text-align: left;
    }
    #footer .actions .primary {
        background: linear-gradient(45deg, #00b4d8, #00f2ff) !important;
        color: #fff !important;
        font-weight: bold !important;
        font-size: 0.85em !important;
        padding: 8px 25px !important; /* تقليل حجم زر الإرسال */
        border: none !important;
        border-radius: 20px !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
        width: auto !important;
        box-shadow: 0 4px 10px rgba(0, 180, 216, 0.2);
    }
    #footer .actions .primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 242, 255, 0.4);
    }

    /* رسالة النجاح */
    #success-message {
        background: #f4f7f9 !important;
        color: #00b4d8 !important;
        padding: 8px !important;
        margin-top: 8px !important;
        border-radius: 6px !important;
        text-align: center !important;
        font-size: 0.8em !important;
        border: 1px solid #e1e8ed;
        font-weight: 600;
    }

    /* حقوق النشر */
    #footer .copyright {
        grid-column: 1 / -1;
        margin: 12px auto 0 auto !important; /* تقليل المسافة العلوية */
        padding-top: 10px !important;
        border-top: 1px solid #f0f3f5 !important;
        text-align: center !important;
        font-size: 0.75em !important;
        color: #8898aa !important;
        list-style: none !important;
        display: flex !important;
        justify-content: center !important;
        gap: 20px !important;
    }
    #footer .copyright a {
        color: #00b4d8 !important;
    }
</style>

<!-- سكربت الـ AJAX الخاص بالفوتر -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('contact-form');
    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(form);
            
            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    form.reset();
                    const msg = document.getElementById('success-message');
                    msg.style.display = 'block';
                    setTimeout(() => {
                        msg.style.display = 'none';
                    }, 4000);
                } else {
                    alert('حدث خطأ: ' + (data.message || ''));
                }
            })
            .catch(error => {
                alert('حدث خطأ في الاتصال: ' + error);
            });
        });
    }
});
</script>
