{% load static %}
<!DOCTYPE HTML>
<html>
<head>
    <title>{% if site_settings %}{{ site_settings.company_name }}{% else %}Clear Document Preparation LLC{% endif %}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="{% static 'omarusaapp/css/main.css' %}" />
    <noscript><link rel="stylesheet" href="{% static 'omarusaapp/css/noscript.css' %}" /></noscript>
    <style>
        /* ============================================
           تحسينات التصميم
           ============================================ */
        .tiles article .image { height: 250px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #f4f4f4; position: relative; }
        .tiles article .image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .tiles article:hover .image img { transform: scale(1.05); }
        .tiles article .image .no-image { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #e8e8e8, #d0d0d0); color: #888; font-size: 1.4em; font-weight: bold; }
        .service-image { width: 100%; max-height: 500px; overflow: hidden; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .service-image img { width: 100%; height: 100%; object-fit: cover; }
        .service-content { line-height: 2; font-size: 1.1em; color: #333; }
        .service-content h2 { color: #2a2a2a; margin-top: 30px; }
        .service-content ul, .service-content ol { margin: 20px 0; padding-left: 30px; }
        .service-content li { margin-bottom: 10px; }
        .about-image { width: 100%; max-height: 400px; overflow: hidden; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .about-image img { width: 100%; height: 100%; object-fit: cover; }
        .about-content { line-height: 2; font-size: 1.1em; color: #333; }
        .contact-info { margin-bottom: 30px; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; line-height: 2; }
        .contact-info p { margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
        .contact-info strong { min-width: 120px; display: inline-block; }
        #menu ul li a { transition: all 0.3s ease; }
        #menu ul li a:hover { color: #4CAF50; padding-left: 10px; }
        .button { transition: all 0.3s ease; }
        .button:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .tiles article { transition: all 0.3s ease; }
        .tiles article:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        #contact-form input, #contact-form textarea { transition: all 0.3s ease; border: 2px solid #e0e0e0; }
        #contact-form input:focus, #contact-form textarea:focus { border-color: #4CAF50; box-shadow: 0 0 10px rgba(76, 175, 80, 0.1); }
        .alert { padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        h1, h2, h3 { font-weight: 700; }
        h1 { font-size: 2.5em; margin-bottom: 20px; color: #2a2a2a; }
        #menu ul li a.active { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body class="is-preload">
    <!-- Wrapper -->
    <div id="wrapper">

        <!-- استدعاء النافبار والقائمة الجانبية -->
        {% include "omarusaapp/partials/_navbar.html" %}

        <!-- Main Content -->
        <div id="main">
            <div class="inner">
                {% block content %}
                {% endblock %}
            </div>
        </div>

        <!-- استدعاء الفوتر -->
        {% include "omarusaapp/partials/_footer.html" %}

    </div>

    <!-- Scripts -->
    <script src="{% static 'omarusaapp/js/jquery.min.js' %}"></script>
    <script src="{% static 'omarusaapp/js/browser.min.js' %}"></script>
    <script src="{% static 'omarusaapp/js/breakpoints.min.js' %}"></script>
    <script src="{% static 'omarusaapp/js/util.js' %}"></script>
    <script src="{% static 'omarusaapp/js/main.js' %}"></script>
</body>
</html>
