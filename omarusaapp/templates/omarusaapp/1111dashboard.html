{% extends "omarusaapp/base.html" %}
{% load static %}

{% block content %}
<style>
    .dashboard-header {
        text-align: center;
        margin-bottom: 40px;
    }
    .dashboard-header h1 {
        font-size: 2.2em;
        font-weight: 800;
        color: #1a2a3a;
    }
    .dashboard-header h1::after {
        content: '';
        display: block;
        width: 80px;
        height: 4px;
        background: var(--turquoise);
        margin: 15px auto 0;
        box-shadow: 0 0 10px var(--neon);
    }

    .dashboard-card {
        background: #ffffff;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.07);
        max-width: 800px;
        margin: 0 auto;
    }

    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        font-weight: 700;
        color: #1a2a3a;
        margin-bottom: 8px;
    }
    .form-group input, .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d9e0;
        border-radius: 8px;
        font-size: 1em;
        transition: all 0.3s;
    }
    .form-group input:focus, .form-group textarea:focus {
        border-color: var(--turquoise);
        outline: none;
        box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
    }
    
    .checkbox-group {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .checkbox-group input {
        width: 20px;
        height: 20px;
        accent-color: var(--turquoise);
    }

    .save-btn {
        background: linear-gradient(45deg, #00b4d8, #00f2ff);
        color: white;
        font-weight: bold;
        padding: 12px 40px;
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 1.1em;
        display: block;
        margin: 30px auto 0;
        box-shadow: 0 4px 15px rgba(0, 180, 216, 0.3);
        transition: all 0.3s;
    }
    .save-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 242, 255, 0.4);
    }

    .section-title {
        font-size: 1.2em;
        color: var(--turquoise);
        margin: 30px 0 15px 0;
        border-bottom: 2px solid #f0f3f5;
        padding-bottom: 10px;
    }
    .section-title:first-child { margin-top: 0; }
</style>

<header class="dashboard-header">
    <h1>لوحة تحكم الموقع</h1>
</header>

<div class="dashboard-card">
    {% if messages %}
        {% for message in messages %}
            <div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <h3 class="section-title">معلومات التواصل</h3>
        <div class="form-group">
            <label>اسم الشركة</label>
            <input type="text" name="company_name" value="{{ settings.company_name }}" />
        </div>
        <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="text" name="phone" value="{{ settings.phone }}" />
        </div>
        <div class="form-group">
            <label>البريد الإلكتروني المعروض</label>
            <input type="email" name="email" value="{{ settings.email }}" />
        </div>
        <div class="form-group">
            <label>رقم واتساب (مع رمز الدولة، اتركه فارغاً لإخفائه)</label>
            <input type="text" name="whatsapp_number" value="{{ settings.whatsapp_number }}" placeholder="مثال: 193318181" />
        </div>
        <div class="form-group">
            <label>العنوان</label>
            <textarea name="address" rows="2">{{ settings.address }}</textarea>
        </div>

        <h3 class="section-title">إعدادات استقبال الرسائل (Email SMTP)</h3>
        <div class="form-group">
            <label>البريد الذي ستصلك عليه رسائل العملاء</label>
            <input type="email" name="admin_receive_email" value="{{ settings.admin_receive_email }}" />
        </div>
        <div class="form-group">
            <label>خادم البريد (SMTP Host)</label>
            <input type="text" name="email_host" value="{{ settings.email_host }}" placeholder="مثال: smtp-relay.brevo.com" />
        </div>
        <div class="form-group">
            <label>بورت البريد (Port)</label>
            <input type="number" name="email_port" value="{{ settings.email_port }}" placeholder="587 أو 465" />
        </div>
        <div class="form-group checkbox-group">
            <input type="checkbox" name="email_use_ssl" {% if settings.email_use_ssl %}checked{% endif %} />
            <label>استخدام SSL (يفضل تفعيله إذا كان البورت 465)</label>
        </div>
        <div class="form-group">
            <label>بريد المرسل (Email User)</label>
            <input type="text" name="email_host_user" value="{{ settings.email_host_user }}" />
        </div>
        <div class="form-group">
            <label>كلمة مرور البريد / المفتاح السري</label>
            <input type="password" name="email_host_password" value="{{ settings.email_host_password }}" />
        </div>

        <button type="submit" class="save-btn">💾 حفظ الإعدادات</button>
    </form>
</div>
{% endblock %}
