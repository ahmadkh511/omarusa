{% load i18n %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — لوحة التحكم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #fff; border-radius: 16px; padding: 40px;
            width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-card h2 { color: #1e293b; font-weight: 700; }
        .login-card .icon-circle {
            width: 64px; height: 64px; background: #3b82f6; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
        }
        .login-card .icon-circle i { font-size: 1.8rem; color: #fff; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="icon-circle">
        <i class="bi bi-shield-lock"></i>
    </div>
    <h2 class="text-center mb-1">لوحة التحكم</h2>
    <p class="text-center text-muted mb-4">سجّل الدخول للمتابعة</p>

    {% if form.errors %}
    <div class="alert alert-danger py-2">
        <small>اسم المستخدم أو كلمة المرور غير صحيحة.</small>
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">اسم المستخدم</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" autofocus required>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label">كلمة المرور</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 btn-lg">
            <i class="bi bi-box-arrow-in-right"></i> دخول
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="/" class="text-decoration-none text-muted">
            <i class="bi bi-arrow-right"></i> العودة للموقع
        </a>
    </div>
</div>

</body>
</html>
